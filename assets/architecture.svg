<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600" role="img" aria-labelledby="title desc">
  <title id="title">Hermes Agent Content Ops architecture</title>
  <desc id="desc">A square architecture diagram for a Hermes Agent content operations system.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#ecfeff"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#134e4a"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#0f766e"/>
    </marker>
  </defs>
  <rect width="1600" height="1600" fill="url(#bg)"/>
  <text x="120" y="150" fill="#0f172a" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="68" font-weight="850">Hermes Agent Content Ops</text>
  <text x="120" y="205" fill="#475569" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="30">Research, generate, package, verify, and draft safely.</text>

  <g font-family="Avenir Next, Helvetica, Arial, sans-serif">
    <rect x="125" y="315" width="410" height="185" rx="36" fill="url(#dark)"/>
    <text x="170" y="385" fill="#67e8f9" font-size="30" font-weight="850">Hermes Agent</text>
    <text x="170" y="430" fill="#f8fafc" font-size="34" font-weight="850">Gateway + cron</text>
    <text x="170" y="468" fill="#cbd5e1" font-size="21">persistent skills and schedules</text>

    <rect x="700" y="285" width="380" height="140" rx="30" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/>
    <text x="745" y="345" fill="#0f172a" font-size="34" font-weight="850">07:00 Morning</text>
    <text x="745" y="385" fill="#64748b" font-size="23">tutorials, tools, how-to</text>

    <rect x="700" y="485" width="380" height="140" rx="30" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/>
    <text x="745" y="545" fill="#0f172a" font-size="34" font-weight="850">18:00 Evening</text>
    <text x="745" y="585" fill="#64748b" font-size="23">trends, reviews, opinion</text>

    <rect x="1175" y="385" width="300" height="170" rx="32" fill="#ffffff" stroke="#67e8f9" stroke-width="2"/>
    <text x="1218" y="450" fill="#0f172a" font-size="32" font-weight="850">Topic Research</text>
    <text x="1218" y="490" fill="#64748b" font-size="22">news, HN, tools</text>
    <text x="1218" y="525" fill="#64748b" font-size="22">candidate scoring</text>

    <rect x="1175" y="705" width="300" height="170" rx="32" fill="#ffffff" stroke="#67e8f9" stroke-width="2"/>
    <text x="1218" y="770" fill="#0f172a" font-size="32" font-weight="850">Article Model</text>
    <text x="1218" y="810" fill="#64748b" font-size="22">provider configured</text>
    <text x="1218" y="845" fill="#64748b" font-size="22">structured output</text>

    <rect x="735" y="780" width="350" height="170" rx="32" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/>
    <text x="780" y="845" fill="#0f172a" font-size="32" font-weight="850">Local Package</text>
    <text x="780" y="885" fill="#64748b" font-size="22">md, html, json, cover</text>
    <text x="780" y="920" fill="#64748b" font-size="22">inspectable artifacts</text>

    <rect x="265" y="780" width="350" height="170" rx="32" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/>
    <text x="310" y="845" fill="#0f172a" font-size="32" font-weight="850">WeChat HTML</text>
    <text x="310" y="885" fill="#64748b" font-size="22">mobile-safe cards</text>
    <text x="310" y="920" fill="#64748b" font-size="22">CTA, risk, modules</text>

    <rect x="265" y="1085" width="350" height="170" rx="32" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/>
    <text x="310" y="1150" fill="#0f172a" font-size="32" font-weight="850">WeChat API</text>
    <text x="310" y="1190" fill="#64748b" font-size="22">upload cover/article</text>
    <text x="310" y="1225" fill="#64748b" font-size="22">draft-first by default</text>

    <rect x="735" y="1085" width="740" height="170" rx="36" fill="#0f172a"/>
    <text x="785" y="1150" fill="#67e8f9" font-size="34" font-weight="850">Xiaohongshu Review Queue</text>
    <text x="785" y="1195" fill="#cbd5e1" font-size="23">Pet-supplies links require human audio/text verification.</text>

    <path d="M535 405H700" stroke="#0f766e" stroke-width="5" marker-end="url(#arrow)"/>
    <path d="M535 440C610 530 640 555 700 555" stroke="#0f766e" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
    <path d="M1080 355C1125 380 1140 420 1175 455" stroke="#0f766e" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
    <path d="M1080 555C1125 530 1140 500 1175 475" stroke="#0f766e" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
    <path d="M1325 555V705" stroke="#0f766e" stroke-width="5" marker-end="url(#arrow)"/>
    <path d="M1175 790H1085" stroke="#0f766e" stroke-width="5" marker-end="url(#arrow)"/>
    <path d="M735 865H615" stroke="#0f766e" stroke-width="5" marker-end="url(#arrow)"/>
    <path d="M440 950V1085" stroke="#0f766e" stroke-width="5" marker-end="url(#arrow)"/>
    <path d="M535 500C590 780 650 1075 735 1165" stroke="#0f766e" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  </g>
</svg>
