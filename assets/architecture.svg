<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">Hermes Agent Content Ops architecture</title>
  <desc id="desc">Architecture diagram for a Hermes Agent workflow that schedules WeChat article drafts and Xiaohongshu review queues.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#ecfeff"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#134e4a"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#0f766e"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1600" height="1050" fill="url(#bg)"/>
  <text x="90" y="105" fill="#0f172a" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="56" font-weight="850">Hermes Agent Content Ops Architecture</text>
  <text x="90" y="154" fill="#475569" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="26">Scheduled agentic workflow: research, generate, package, verify, and draft safely.</text>

  <g font-family="Avenir Next, Helvetica, Arial, sans-serif">
    <g transform="translate(90 230)" filter="url(#shadow)">
      <rect width="310" height="150" rx="28" fill="url(#dark)"/>
      <text x="32" y="58" fill="#67e8f9" font-size="22" font-weight="800">Hermes Agent</text>
      <text x="32" y="96" fill="#f8fafc" font-size="24" font-weight="750">Gateway + cron</text>
      <text x="32" y="126" fill="#cbd5e1" font-size="17">Persistent skills and schedules</text>
    </g>

    <g transform="translate(500 180)" filter="url(#shadow)">
      <rect width="300" height="118" rx="24" fill="#ffffff" stroke="#99f6e4"/>
      <text x="28" y="52" fill="#0f172a" font-size="24" font-weight="800">07:00 Morning</text>
      <text x="28" y="84" fill="#64748b" font-size="18">tutorials, tools, how-to</text>
    </g>
    <g transform="translate(500 340)" filter="url(#shadow)">
      <rect width="300" height="118" rx="24" fill="#ffffff" stroke="#99f6e4"/>
      <text x="28" y="52" fill="#0f172a" font-size="24" font-weight="800">18:00 Evening</text>
      <text x="28" y="84" fill="#64748b" font-size="18">trends, reviews, opinion</text>
    </g>

    <g transform="translate(905 260)" filter="url(#shadow)">
      <rect width="300" height="150" rx="28" fill="#ffffff" stroke="#67e8f9"/>
      <text x="28" y="54" fill="#0f172a" font-size="24" font-weight="800">Topic Research</text>
      <text x="28" y="88" fill="#64748b" font-size="18">news, HN, tool updates</text>
      <text x="28" y="118" fill="#64748b" font-size="18">candidate scoring</text>
    </g>

    <g transform="translate(1295 260)" filter="url(#shadow)">
      <rect width="230" height="150" rx="28" fill="#ffffff" stroke="#67e8f9"/>
      <text x="28" y="54" fill="#0f172a" font-size="24" font-weight="800">Article Model</text>
      <text x="28" y="88" fill="#64748b" font-size="18">configured provider</text>
      <text x="28" y="118" fill="#64748b" font-size="18">structured JSON</text>
    </g>

    <g transform="translate(210 585)" filter="url(#shadow)">
      <rect width="310" height="150" rx="28" fill="#ffffff" stroke="#99f6e4"/>
      <text x="28" y="54" fill="#0f172a" font-size="24" font-weight="800">WeChat HTML</text>
      <text x="28" y="88" fill="#64748b" font-size="18">mobile-safe cards</text>
      <text x="28" y="118" fill="#64748b" font-size="18">CTA, risk, visual modules</text>
    </g>

    <g transform="translate(635 585)" filter="url(#shadow)">
      <rect width="310" height="150" rx="28" fill="#ffffff" stroke="#99f6e4"/>
      <text x="28" y="54" fill="#0f172a" font-size="24" font-weight="800">Local Package</text>
      <text x="28" y="88" fill="#64748b" font-size="18">md, html, json, cover</text>
      <text x="28" y="118" fill="#64748b" font-size="18">inspectable artifacts</text>
    </g>

    <g transform="translate(1060 585)" filter="url(#shadow)">
      <rect width="310" height="150" rx="28" fill="#ffffff" stroke="#99f6e4"/>
      <text x="28" y="54" fill="#0f172a" font-size="24" font-weight="800">WeChat API</text>
      <text x="28" y="88" fill="#64748b" font-size="18">upload cover + article</text>
      <text x="28" y="118" fill="#64748b" font-size="18">draft-first by default</text>
    </g>

    <g transform="translate(500 825)" filter="url(#shadow)">
      <rect width="600" height="118" rx="28" fill="#0f172a"/>
      <text x="36" y="52" fill="#67e8f9" font-size="24" font-weight="800">Xiaohongshu Review Queue</text>
      <text x="36" y="85" fill="#cbd5e1" font-size="18">Pet-supplies links require human audio/text verification before saving.</text>
    </g>

    <path d="M400 305H500" stroke="#0f766e" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M400 330C450 385 465 395 500 400" stroke="#0f766e" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <path d="M800 239C850 260 870 290 905 320" stroke="#0f766e" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <path d="M800 399C850 380 870 360 905 340" stroke="#0f766e" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <path d="M1205 335H1295" stroke="#0f766e" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M1410 410C1320 540 1200 585 945 650" stroke="#0f766e" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <path d="M945 660H1060" stroke="#0f766e" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M635 660H520" stroke="#0f766e" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M245 380C270 565 310 740 500 865" stroke="#0f766e" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  </g>
</svg>

