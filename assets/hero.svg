      <circle cx="58" cy="58" r="22" fill="#99f6e4" opacity="0.2"/>
      <text x="92" y="67" fill="#f8fafc" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="28" font-weight="800">Review Queue</text>
      <text x="34" y="126" fill="#cbd5e1" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="24">Xiaohongshu pet supplies</text>
      <text x="34" y="164" fill="#94a3b8" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="19">human-in-the-loop checks</text>
    </g>

