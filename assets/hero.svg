      <text x="92" y="67" fill="#f8fafc" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="28" font-weight="800">18:00</text>
      <text x="34" y="126" fill="#cbd5e1" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="24">Trend / opinion piece</text>
      <text x="34" y="164" fill="#94a3b8" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="19">layout -> API draft box</text>
    </g>

