<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Hermes Agent Content Ops hero image</title>
  <desc id="desc">A dark AI operations dashboard showing Hermes Agent coordinating scheduled WeChat content and Xiaohongshu research queues.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061622"/>
      <stop offset="0.45" stop-color="#0b2f3a"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102436" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#0b1726" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.29 0 0 0 0 0.93 0 0 0 0 0.84 0 0 0 0.7 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <circle cx="1310" cy="160" r="210" fill="#22d3ee" opacity="0.14" filter="url(#glow)"/>
  <circle cx="220" cy="760" r="260" fill="#14b8a6" opacity="0.13" filter="url(#glow)"/>
  <path d="M1060 120C1260 230 1360 385 1450 640" fill="none" stroke="#67e8f9" stroke-opacity="0.18" stroke-width="2"/>
  <path d="M180 235C380 330 545 430 760 690" fill="none" stroke="#5eead4" stroke-opacity="0.16" stroke-width="2"/>

  <g transform="translate(110 105)">
