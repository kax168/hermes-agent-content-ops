    <text x="76" y="110" fill="#67e8f9" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="4">HERMES AGENT CHALLENGE</text>
    <text x="76" y="185" fill="#f8fafc" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="72" font-weight="800">Content Ops Agent</text>
    <text x="76" y="248" fill="#cbd5e1" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="31">Scheduled AI media workflow for WeChat drafts and research queues</text>

    <g transform="translate(76 330)">
      <rect width="340" height="210" rx="28" fill="#081827" stroke="#22d3ee" stroke-opacity="0.35"/>
